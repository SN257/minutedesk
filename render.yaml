# Render.com Deployment Configuration for MinuteDesk Backend
# This file tells Render how to build and start your backend

services:
  - type: web
    name: minutedesk-backend
    runtime: node
    region: singapore  # Closest to India
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: minutedesk-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://your-app-name.vercel.app
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 1

databases:
  - name: minutedesk-db
    plan: free
    region: singapore
    databaseName: minutedesk
    user: minutedesk_user
