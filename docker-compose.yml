version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minutedesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - minutedesk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (NestJS) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - minutedesk
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: minutedesk
      DB_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-changeme}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vk.harivadan.in,http://localhost:5173,http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-user}
      SMTP_PASS: ${SMTP_PASS:-pass}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    expose:
      - "3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - minutedesk
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
    ports:
      - "3000:80"

networks:
  minutedesk:
    driver: bridge

volumes:
  postgres_data:
